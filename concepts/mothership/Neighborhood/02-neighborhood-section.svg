<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1030" role="img"><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#fbfaf6"/><text x="60" y="48" font-size="28" fill="#273c49" text-anchor="start">归航号 / A—A 局部展开剖面</text><text x="60" y="78" font-size="15" fill="#273c49" text-anchor="start">剖切位置见平面 u=24m；向纵向看。上下层按同一 v 坐标对齐。</text><rect x="90" y="480" width="840" height="16.8" fill="#617887" stroke="#647783" stroke-width="1"/><rect x="90" y="328.79999999999995" width="336" height="16.8" fill="#617887" stroke="#647783" stroke-width="1"/><rect x="594" y="328.79999999999995" width="336" height="16.8" fill="#617887" stroke="#647783" stroke-width="1"/><rect x="90" y="177.59999999999997" width="840" height="16.8" fill="#617887" stroke="#647783" stroke-width="1"/><rect x="90" y="194.40000000000003" width="252" height="134.4" fill="#f4eee2" stroke="#647783" stroke-width="1"/><text x="216.0" y="265.8" font-size="13" fill="#273c49" text-anchor="middle">住舱 / N06</text><rect x="342" y="194.40000000000003" width="84" height="134.4" fill="#d7e4e8" stroke="#647783" stroke-width="1"/><text x="384.0" y="265.8" font-size="13" fill="#273c49" text-anchor="middle">安静廊</text><rect x="594" y="194.40000000000003" width="84" height="134.4" fill="#d7e4e8" stroke="#647783" stroke-width="1"/><text x="636.0" y="265.8" font-size="13" fill="#273c49" text-anchor="middle">安静廊</text><rect x="678" y="194.40000000000003" width="252" height="134.4" fill="#f4eee2" stroke="#647783" stroke-width="1"/><text x="804.0" y="265.8" font-size="13" fill="#273c49" text-anchor="middle">住舱 / S06</text><rect x="90" y="345.6" width="84" height="134.4" fill="#e0e4e2" stroke="#647783" stroke-width="1"/><text x="132.0" y="421.2" font-size="13" fill="#273c49" text-anchor="middle">后场</text><rect x="174" y="345.6" width="252" height="134.4" fill="#eee3cf" stroke="#647783" stroke-width="1"/><text x="300.0" y="421.2" font-size="13" fill="#273c49" text-anchor="middle">备餐 K</text><rect x="426" y="345.6" width="168" height="134.4" fill="#eee3cf" stroke="#647783" stroke-width="1"/><text x="510.0" y="421.2" font-size="13" fill="#273c49" text-anchor="middle">公共街廊</text><rect x="594" y="345.6" width="252" height="134.4" fill="#dbe6d1" stroke="#647783" stroke-width="1"/><text x="720.0" y="421.2" font-size="13" fill="#273c49" text-anchor="middle">培养 G</text><rect x="846" y="345.6" width="84" height="134.4" fill="#e0e4e2" stroke="#647783" stroke-width="1"/><text x="888.0" y="421.2" font-size="13" fill="#273c49" text-anchor="middle">后场</text><text x="510" y="265.8" font-size="15" fill="#273c49" text-anchor="middle">通高</text><line x1="426" y1="328.79999999999995" x2="426" y2="194.40000000000003" stroke="#3d7f93" stroke-width="4" stroke-dasharray=""/><line x1="594" y1="328.79999999999995" x2="594" y2="194.40000000000003" stroke="#3d7f93" stroke-width="4" stroke-dasharray=""/><line x1="342" y1="328.79999999999995" x2="342" y2="236.4" stroke="#fbfaf6" stroke-width="7" stroke-dasharray=""/><line x1="342" y1="328.79999999999995" x2="342" y2="236.4" stroke="#a6513e" stroke-width="2" stroke-dasharray="4 3"/><text x="342" y="223.8" font-size="10" fill="#273c49" text-anchor="middle">门高2.2</text><line x1="678" y1="328.79999999999995" x2="678" y2="236.4" stroke="#fbfaf6" stroke-width="7" stroke-dasharray=""/><line x1="678" y1="328.79999999999995" x2="678" y2="236.4" stroke="#a6513e" stroke-width="2" stroke-dasharray="4 3"/><text x="678" y="223.8" font-size="10" fill="#273c49" text-anchor="middle">门高2.2</text><line x1="594" y1="480" x2="594" y2="345.6" stroke="#3d7f93" stroke-width="4" stroke-dasharray=""/><circle cx="510" cy="414.9" r="5" fill="#354e5f"/><line x1="510" y1="420.9" x2="510" y2="454.8" stroke="#354e5f" stroke-width="4" stroke-dasharray=""/><line x1="510" y1="454.8" x2="500" y2="480" stroke="#354e5f" stroke-width="3" stroke-dasharray=""/><line x1="510" y1="454.8" x2="520" y2="480" stroke="#354e5f" stroke-width="3" stroke-dasharray=""/><text x="960" y="177.59999999999997" font-size="14" fill="#273c49" text-anchor="start">7.2m</text><text x="960" y="328.79999999999995" font-size="14" fill="#273c49" text-anchor="start">+3.6m</text><text x="960" y="480" font-size="14" fill="#273c49" text-anchor="start">0.0m</text><text x="60" y="541" font-size="14" fill="#273c49" text-anchor="start">两层地坪间距 3.6m；每层0.4m作为楼板/设备厚度候选，3.2m为装修前高度预算。</text><text x="60" y="569" font-size="14" fill="#273c49" text-anchor="start">本剖面横跨20m展开带；曲率、半径与重力梯度尚未确定，不能直接据此制造平直旋转舱。</text><text x="60" y="597" font-size="14" fill="#273c49" text-anchor="start">蓝色界面：楼上隔声廊墙 / 楼下培养观察隔断。公共活动声的控制仍需门、风管和结构设计。</text><text x="60" y="640" font-size="19" fill="#273c49" text-anchor="start">培养入口 V / 4×6m 局部平面（与总图同向）</text><rect x="150" y="680" width="184" height="276" fill="#e5e7e1" stroke="#647783" stroke-width="1"/><text x="242" y="668" font-size="13" fill="#273c49" text-anchor="middle">公共街廊 / v=12</text><text x="135" y="818" font-size="13" fill="#273c49" text-anchor="end">培养</text><line x1="214.39999999999998" y1="680" x2="269.6" y2="680" stroke="#fbfaf6" stroke-width="6" stroke-dasharray=""/><line x1="150" y1="790.4" x2="150" y2="845.6" stroke="#fbfaf6" stroke-width="6" stroke-dasharray=""/><rect x="196" y="919.2" width="59.800000000000004" height="27.599999999999998" fill="#bad2d8" stroke="#647783" stroke-width="1"/><rect x="292.6" y="749.0" width="27.599999999999998" height="115.0" fill="#cbbda5" stroke="#647783" stroke-width="1"/><path d="M 242 666 V 818 H 130" fill="none" stroke="#a6513e" stroke-width="3"/><text x="390" y="714" font-size="16" fill="#273c49" text-anchor="start">V-public：公共侧完整门</text><text x="390" y="743" font-size="16" fill="#273c49" text-anchor="start">V-grow：左侧培养完整门</text><text x="390" y="772" font-size="14" fill="#273c49" text-anchor="start">两门工作尺寸：宽1.2m × 高2.2m</text><text x="390" y="801" font-size="14" fill="#273c49" text-anchor="start">前门 → 转身 → 左门；后墙洗手，右墙更衣。</text><text x="390" y="830" font-size="14" fill="#273c49" text-anchor="start">剖去顶盖与右前墙时，仍保留完整门框和门高参照。</text><text x="390" y="859" font-size="14" fill="#273c49" text-anchor="start">图示人员通道；收获/废物经背面的封闭物料窗。</text><text x="390" y="888" font-size="14" fill="#273c49" text-anchor="start">此处是卫生缓冲，不是太空气闸、压力转换或隔离病房。</text><text x="60" y="997" font-size="13" fill="#273c49" text-anchor="start">当地“下方”指向外缘；左/右是展开关系，不代表船体全局上下。半径、固定轴接口和压力分区留待总体研究。</text></svg>